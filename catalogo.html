<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Catálogo de artesanías de Metepec.">
<title>Catálogo · METZA</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏺</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="catalogo" data-title="Catálogo">
<main>
<div class="ph"><h1>Catálogo artesanal</h1><p>Piezas de barro y tradición, hechas a mano en Metepec.</p></div>
<section class="wrap">
  <div class="tool">
    <input id="q" type="search" placeholder="Buscar piezas, por ejemplo: catrina" aria-label="Buscar piezas">
    <select id="sort" aria-label="Ordenar"><option value="">Destacados</option><option value="asc">Precio: menor a mayor</option><option value="desc">Precio: mayor a menor</option></select>
  </div>
  <div class="pills" id="cats" role="group" aria-label="Categorías"></div>
  <p class="mut" id="count"></p>
  <div class="grid" id="grid"></div>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
