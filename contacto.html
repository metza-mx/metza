<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Escríbenos para dudas o solicitudes especiales.">
<title>Contacto · METZA</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏺</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<body data-page="contacto" data-title="Contacto">
<main>
<div class="ph"><h1>Contáctanos</h1><p>¿Tienes alguna duda o solicitud especial? Escríbenos.</p></div>
<section class="wrap">
  <div class="card cf">
    <form class="fm" id="fContact">
      <label>Nombre<input name="n" required></label>
      <label>Correo electrónico<input name="e" type="email" required></label>
      <label class="w">Mensaje<textarea name="m" rows="5" required></textarea></label>
      <button class="btn dk w" style="padding:15px">Enviar mensaje</button>
    </form>
  </div>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
